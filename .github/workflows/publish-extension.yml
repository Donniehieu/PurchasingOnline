name: Publish Chrome extension
# Đẩy tag dạng ext-v1.2.0 (khớp "version" trong extension/manifest.json) để tự đăng lên Chrome Web Store.
# Chrome của mọi người dùng sẽ tự cập nhật sau khi Google duyệt, không ai phải cập nhật tay.
on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Tag phải khớp phiên bản trong manifest
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          if [ "ext-v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} không khớp manifest $V"; exit 1; fi
      - run: npm run build:ext
      - name: Đăng lên Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          npx --yes chrome-webstore-upload-cli@3 upload --source "dist/mua-hang-extension-v${V}.zip" --auto-publish
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
